plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
}

// Online-only build: disable native/offline inference packaging for smaller APK
def enableNativeBuild = false
def resolvedLlamaDir = null

if (enableNativeBuild) {
    def candidate = System.getenv("LLAMA_CPP_DIR")
    if (candidate == null || candidate.trim().isEmpty()) {
        candidate = file(rootDir.absolutePath + "/../Compressed/llama.cpp-master").absolutePath
    }
    if (file(candidate).exists()) {
        resolvedLlamaDir = candidate
    } else {
        enableNativeBuild = false
        logger.lifecycle("llama.cpp not found at ${candidate} -> skipping native build")
    }
}

def prebuiltUrl = System.getenv('PREBUILT_LIBS_URL')
if (prebuiltUrl != null && !prebuiltUrl.trim().isEmpty()) {
    tasks.register('downloadPrebuiltLibs', Exec) {
        workingDir rootDir
        if (System.properties['os.name'].toLowerCase().contains('windows')) {
            commandLine 'powershell', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/fetch_prebuilt_libs.ps1'
        } else {
            commandLine 'bash', 'scripts/fetch_prebuilt_libs.sh'
        }
    }
    preBuild.dependsOn tasks.named('downloadPrebuiltLibs')
}

android {
    namespace 'com.persianai.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.persianai.assistant"
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName "5.12"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
        doNotStrip '**/libc++_shared.so'
        merge '**/libc++_shared.so'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_TYPE", '"release"'
            buildConfigField "boolean", "DEBUG_LOG", 'false'
            debuggable false
            shrinkResources false
        }
        debug {
            debuggable true
            buildConfigField "String", "BUILD_TYPE", '"debug"'
            buildConfigField "boolean", "DEBUG_LOG", 'true'
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        checkReleaseBuilds true
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation', 'MissingDimensionality', 'UnusedResources'
        disable 'TypographyFractions', 'TypographyQuotes'
        enable 'GradleCompatible', 'SdkVersionWarning', 'InvalidPackage'
    }

    packagingOptions {
        exclude 'META-INF/proguard/androidx-*.pro'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/LGPL2.1'
        exclude 'META-INF/*.kotlin_module'

        resources {
            excludes += [
                'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/MANIFEST.MF',
                'META-INF/proguard/androidx-*.pro'
            ]
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            def prebuilt = file(rootDir.absolutePath + '/prebuilt_libs')
            if (prebuilt.exists()) {
                jniLibs.srcDirs += prebuilt
                logger.lifecycle("Including prebuilt native libs from ${prebuilt}")
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.maps:google-maps-services:0.18.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Kotlin Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'

    // Google Services
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-places:17.0.0'

    // Google Places
    implementation 'com.google.android.libraries.places:places:3.3.0'
    implementation 'com.google.maps.android:android-maps-utils:2.3.0'
    
    // Google Drive API
    implementation 'com.google.android.gms:play-services-drive:17.0.0'
    implementation 'com.google.http-client:google-http-client-gson:1.43.3'

    // Crypto
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Work Manager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Lottie
    implementation 'com.airbnb.android:lottie:6.2.0'

    // ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-dash:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'
    implementation 'com.google.android.exoplayer:extension-mediasession:2.19.1'

    // Media
    implementation 'androidx.media:media:1.7.0'

    // SLF4J
    implementation 'org.slf4j:slf4j-simple:1.7.25'

    // ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.0'

    // MPAndroidChart - for monthly dashboards
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}