name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, New ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_report.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Handle Result (Push APK or Error Log)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ست کردن ریموت برای اطمینان از اجازه Push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            echo "Build failed. Preparing error log..."
            tail -n 100 build_report.txt > build_error_summary.txt
            git add build_error_summary.txt
            git commit -m "❌ Build Failed: See build_error_summary.txt [skip ci]" || echo "No changes to commit"
          else
            echo "Build successful. Preparing APK..."
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              cp app/build/outputs/apk/debug/app-debug.apk ./ready-to-download.apk
              git add ready-to-download.apk
              git commit -m "📦 Build Success: ready-to-download.apk [skip ci]" || echo "No changes to commit"
            else
              echo "APK file not found!"
              exit 1
            fi
          fi
          
          git push origin HEAD:${{ github.ref }} --force

      - name: Final Check
        if: env.BUILD_FAILED == 'true'
        run: exit 1
