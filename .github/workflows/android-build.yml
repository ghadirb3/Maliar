name: Android Release Build
on:
  workflow_dispatch:

permissions:
  contents: write # اجازه حیاتی برای ساخت Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Prepare Error Log
        if: env.BUILD_FAILED == 'true'
        run: |
          echo "# Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '
```' >> $GITHUB_STEP_SUMMARY
tail -n 150 build_log.txt >> $GITHUB_STEP_SUMMARY
echo '
```' >> $GITHUB_STEP_SUMMARY

      - name: Create Release and Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
          body: "Build completed successfully. Try downloading the APK below."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
