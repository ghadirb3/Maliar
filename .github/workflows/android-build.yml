name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, New ]
  pull_request:
    branches: [ main, master, develop, New ]

# اجازه نوشتن در مخزن برای آپلود خودکار لاگ خطا
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        # اجرای بیلد و ذخیره خروجی در فایل. حتی اگر خطا بدهد، به مرحله بعد می‌رود.
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_report.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Push Error Log to Repo
        if: env.BUILD_FAILED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # فقط ۵۰ خط آخر که مربوط به خطای اصلی است را نگه می‌داریم تا فایل سبک باشد
          tail -n 100 build_report.txt > build_error_summary.txt
          
          git add build_error_summary.txt
          git commit -m "docs: add latest build error log [skip ci]"
          git push origin HEAD:${{ github.ref }}
          
          # در نهایت اکشن را قرمز کن تا متوجه شویم تمام شده
          exit 1

      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
