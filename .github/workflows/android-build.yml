name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, New ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # دریافت کل تاریخچه برای جلوگیری از خطای Push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_report.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Upload Result to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # تنظیمات اولیه گیت
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # هماهنگ‌سازی با آخرین تغییرات سرور برای جلوگیری از تداخل
          git pull origin ${{ github.ref_name }} --rebase

          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            echo "Build failed. Preparing error log..."
            tail -n 100 build_report.txt > build_error_summary.txt
            git add build_error_summary.txt
            git commit -m "❌ Error Log Update [skip ci]" || echo "No changes"
          else
            echo "Build successful. Preparing APK..."
            # پیدا کردن فایل APK در هر مسیری که ساخته شده باشد
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" ./ready-to-download.apk
              git add ready-to-download.apk
              git commit -m "📦 APK Update [skip ci]" || echo "No changes"
            else
              echo "APK NOT FOUND!"
              exit 1
            fi
          fi
          
          # تلاش برای Push با استفاده از توکن
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }} --force

      - name: Report Build Status
        if: env.BUILD_FAILED == 'true'
        run: |
          echo "Build failed! Check the build_error_summary.txt file in your repository."
          exit 1
