name: Android Build Summary
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # نیازی به نوشتن نیست تا خطا ندهد
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Generate Summary Report
        if: always()
        run: |
          echo "# 📱 Android Build Report" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            echo "## ❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
            echo "### Error Details (Last 100 lines):" >> $GITHUB_STEP_SUMMARY
            echo '
```bash' >> $GITHUB_STEP_SUMMARY
tail -n 100 build_log.txt >> $GITHUB_STEP_SUMMARY
echo '
```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            echo "APK Location: $APK_PATH" >> $GITHUB_STEP_SUMMARY
            echo "### APK File Info:" >> $GITHUB_STEP_SUMMARY
            ls -lh $APK_PATH >> $GITHUB_STEP_SUMMARY
            
            # تبدیل APK به کد Base64 (فقط برای فایل‌های کوچک زیر 50-60 مگابایت)
            # اگر فایل بزرگ باشد، این بخش ممکن است کار نکند
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "Note: Download not possible via Summary. Please check Artifacts tab." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifact
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
