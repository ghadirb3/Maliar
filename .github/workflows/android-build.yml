name: Android Build & Download
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Generate Summary Report
        if: always()
        run: |
          echo "# 📱 Android Build Report" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            echo "## ❌ BUILD FAILED" >> $GITHUB_STEP_SUMMARY
            echo "### Error Log:" >> $GITHUB_STEP_SUMMARY
            echo '
```' >> $GITHUB_STEP_SUMMARY
tail -n 100 build_log.txt >> $GITHUB_STEP_SUMMARY
echo '
```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ BUILD SUCCESSFUL" >> $GITHUB_STEP_SUMMARY
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            
            echo "### 📦 APK Base64 Data (Manual Download)" >> $GITHUB_STEP_SUMMARY
            echo "Copy the codes below and save as 'apk_base64.txt' on your computer." >> $GITHUB_STEP_SUMMARY
            
            # تبدیل APK به بیس64 و تکه تکه کردن به بخش های 50 هزار کاراکتری
            base64 -w 0 "$APK_PATH" > apk_base64.txt
            split -b 50000 -d --additional-suffix=.txt apk_base64.txt part_
            
            for f in part_*.txt; do
              echo "#### Part $f" >> $GITHUB_STEP_SUMMARY
              echo '
```' >> $GITHUB_STEP_SUMMARY
cat "$f" >> $GITHUB_STEP_SUMMARY
echo '
```' >> $GITHUB_STEP_SUMMARY
            done
          fi
