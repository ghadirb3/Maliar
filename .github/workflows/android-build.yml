name: Android CI Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_report.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Prepare Files
        run: |
          mkdir -p output_folder
          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            tail -n 100 build_report.txt > output_folder/error_log.txt
          else
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" output_folder/ready-to-download.apk
            else
              echo "APK NOT FOUND" > output_folder/error_log.txt
            fi
          fi

      - name: Direct Upload to Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output_folder
          publish_branch: download-zone # فایل ها در این شاخه ذخیره میشوند
          force_orphan: true # تاریخچه قبلی را پاک میکند تا حجم مخزن زیاد نشود

      - name: Failure Check
        if: env.BUILD_FAILED == 'true'
        run: exit 1
