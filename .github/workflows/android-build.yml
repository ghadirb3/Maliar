name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, New ]
  pull_request:
    branches: [ main, master, develop, New ]

# اجازه ساخت Issue را به ورک‌فلو می‌دهد
permissions:
  issues: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android SDK commandline tools
        uses: android-actions/setup-android@v3

      - name: Install NDK r25c
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Verify libc++_shared present
        run: |
          ls -l $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/*/sysroot/usr/lib/*/libc++_shared.so || true

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        # خروجی بیلد را در فایل build_log.txt ذخیره می‌کنیم
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_log.txt 2>&1

      - name: Assert libc++_shared packaged
        if: success()
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "libc++_shared" || (echo "libc++_shared.so missing in APK" && exit 1)

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # این بخش فقط در صورت شکست (failure) اجرا می‌شود
      - name: Report Error in Issues
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## ❌ Build Failed - Error Logs" > issue_body.md
          echo "Last 100 lines of build log:" >> issue_body.md
          echo '
```text' >> issue_body.md
if [ -f build_log.txt ]; then
tail -n 100 build_log.txt >> issue_body.md
else
echo "No build_log.txt found. The error might have happened before the build step." >> issue_body.md
fi
echo '
```' >> issue_body.md
          
          # ساخت یک ایشو جدید با متن خطا
          gh issue create --title "Build Error Report: $GITHUB_SHA" --body-file issue_body.md
