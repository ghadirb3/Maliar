name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, New ]
  pull_request:
    branches: [ main, master, develop, New ]

permissions:
  issues: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # آپدیت شده به نسخه 4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        id: gradle_build
        # با این دستور، حتی اگر بیلد خطا بدهد، اکشن متوقف نمی‌شود تا بتوانیم لاگ را ذخیره کنیم
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_log.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Display Error in Summary
        if: always()
        run: |
          echo "# 📋 Build Report" >> $GITHUB_STEP_SUMMARY
          if [ "$BUILD_FAILED" = "true" ]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "### Last 50 lines of error log:" >> $GITHUB_STEP_SUMMARY
            echo '
```text' >> $GITHUB_STEP_SUMMARY
tail -n 50 build_log.txt >> $GITHUB_STEP_SUMMARY
echo '
```' >> $GITHUB_STEP_SUMMARY
            
            # ایجاد ایشو به عنوان راه دوم
            gh issue create --title "Build Failed" --body "Check Action Summary for logs" || true
            
            exit 1 # حالا که گزارش را نوشتیم، وضعیت اکشن را قرمز کن
          else
            echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK
        if: env.BUILD_FAILED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
