name: Android CI Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop, New ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        # اجرای بیلد و ذخیره خروجی. اگر خطا بدهد، BUILD_FAILED ست می‌شود.
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_report.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Handle Result (Push APK or Error Log)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            echo "Build failed. Preparing error log..."
            tail -n 100 build_report.txt > build_error_summary.txt
            git add build_error_summary.txt
            git commit -m "❌ Build Failed: See build_error_summary.txt [skip ci]" || echo "No changes"
          else
            echo "Build successful. Preparing APK..."
            cp app/build/outputs/apk/debug/app-debug.apk ./ready-to-download.apk
            git add ready-to-download.apk
            git commit -m "📦 Build Success: ready-to-download.apk [skip ci]" || echo "No changes"
          fi
          
          git push origin HEAD:${{ github.ref }} --force

      - name: Final Check
        if: env.BUILD_FAILED == 'true'
        run: exit 1
