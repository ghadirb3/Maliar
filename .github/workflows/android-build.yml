name: Android CI Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g" > build_report.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Deploy to Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # آماده‌سازی پوشه خروجی
          mkdir -p deploy
          if [ "${{ env.BUILD_FAILED }}" == "true" ]; then
            tail -n 100 build_report.txt > deploy/error_log.txt
          else
            APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
            cp "$APK_PATH" deploy/ready-to-download.apk
          fi

          # عملیات Push به شاخه مجزا
          cd deploy
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Build Assets"
          # اجبار به آپلود در شاخه‌ای به نام output
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:output

      - name: Check Status
        if: env.BUILD_FAILED == 'true'
        run: exit 1
